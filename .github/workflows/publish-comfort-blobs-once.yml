name: Publish verified comfort source blobs once
on:
  push:
    branches: [chore/comfort-source-transfer-20261012]
    paths: [.github/workflows/publish-comfort-blobs-once.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'vamsimarripudi/vamsi-portfolio' && github.ref == 'refs/heads/chore/comfort-source-transfer-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify tested source bytes and upload Git blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          digest = '948eca287864289ce021afb6bb2037d67f67a9f416cc186de44ecb6eb11999d5'
          url = 'https://sb-1dqbx0n6n53u.vercel.run/source-' + digest + '.json'
          with urllib.request.urlopen(url, timeout=20) as response:
              data = response.read(300000)
          assert hashlib.sha256(data).hexdigest() == digest, 'Source transfer integrity failed'
          items = json.loads(data)
          assert len(items) == 20
          for item in items:
              content = item['content'].encode('utf-8')
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              assert expected == item['sha']
              body = json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode()
              request = urllib.request.Request('https://api.github.com/repos/vamsimarripudi/vamsi-portfolio/git/blobs', data=body, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'
              })
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              assert result['sha'] == expected
              print(item['path'] + ' ' + expected, flush=True)
          print('20 verified blobs uploaded; this job changed no tree, branch, workflow or deployment.')
          PY

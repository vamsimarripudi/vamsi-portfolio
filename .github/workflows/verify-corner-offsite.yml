name: Verify Corner offsite recovery
on:
  push:
    branches:
      - feat/corner-verified-offsite-backups-20261008
permissions:
  contents: read
jobs:
  offsite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install portfolio packages
        run: npm ci
      - name: Portfolio lint
        run: npm run lint
      - name: Portfolio unit tests
        run: npm test
      - name: Portfolio build
        run: npm run build
      - name: Corner full checks (including isolated backup, S3 mock, restored SQLite and scheduler)
        working-directory: corner
        run: npm run check

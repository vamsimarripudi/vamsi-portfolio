name: Corner identity source handoff
on:
  push:
    branches: [feat/corner-identity-v2-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: tar -czf /tmp/corner-source.tar.gz corner
      - uses: actions/upload-artifact@v4
        with:
          name: corner-identity-source
          path: /tmp/corner-source.tar.gz
          retention-days: 1

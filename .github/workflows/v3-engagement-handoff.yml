name: V3 Engagement source handoff
on:
  push:
    paths:
      - '.github/workflows/v3-engagement-handoff.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: tar -czf /tmp/v3-engagement-source.tgz corner
      - uses: actions/upload-artifact@v4
        with:
          name: corner-v3-engagement-source
          path: /tmp/v3-engagement-source.tgz
          retention-days: 1
# Refresh source after the gated V3 user-facing routes and tests.

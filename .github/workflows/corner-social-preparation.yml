name: Prepare isolated Corner test dependencies
on:
  push:
    branches: ['feat/corner-social-publishing-20261028']
    paths: ['.github/workflows/corner-social-preparation.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/feat/corner-social-publishing-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install only repository-declared test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix corner install --omit=dev --no-audit --no-fund --package-lock=false
          tar -czf /tmp/corner-social-dependencies.tar.gz node_modules corner/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: corner-social-dependencies
          path: /tmp/corner-social-dependencies.tar.gz
          retention-days: 1

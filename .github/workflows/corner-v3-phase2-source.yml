name: Corner V3 Phase 2 isolated source handoff
on:
  push:
    paths:
      - '.github/workflows/corner-v3-phase2-source.yml'
      - 'corner/**'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Package tracked Corner sources
        run: tar -czf /tmp/corner-v3-phase2-source.tar.gz corner
      - uses: actions/upload-artifact@v4
        with:
          name: corner-v3-phase2-source
          path: /tmp/corner-v3-phase2-source.tar.gz
          retention-days: 2

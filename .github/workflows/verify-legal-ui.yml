name: Verify legal UI and notifications
on:
  push:
    branches:
      - feat/policy-reader-and-toast-refresh-20261008
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea8642d1e84afbd3f7d6820020 # v4.2.2
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Existing unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Browser-level privacy, terms and toast smoke
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/portfolio-vite.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 3
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
          const page = await browser.newPage({ viewport: { width: 1365, height: 850 }, reducedMotion: 'reduce' });
          const base = 'http://127.0.0.1:4173';
          try {
            await page.goto(base + '/privacy');
            await page.locator('.legal-clause').first().waitFor();
            assert.equal(await page.locator('.legal-clause').count(), 9, 'privacy retains 9 sections');
            assert.equal(await page.locator('.legal-reader-sidebar .legal-toc a').count(), 9, 'desktop toc present');
            assert.ok((await page.locator('.legal-clause').first().innerText()).includes('What this notice covers'), 'privacy copy');
            await page.locator('.legal-reader-sidebar .legal-toc a').nth(1).click();
            assert.ok(page.url().includes('#privacy-'), 'privacy anchor');

            await page.goto(base + '/terms');
            assert.equal(await page.locator('.legal-clause').count(), 5, 'terms retains 5 sections');
            assert.ok((await page.locator('.legal-clause').first().innerText()).includes('Using this site'), 'terms copy');

            await page.setViewportSize({ width: 375, height: 812 });
            await page.goto(base + '/privacy');
            const index = page.locator('details.legal-mobile-contents');
            await index.locator('summary').click();
            assert.equal(await index.evaluate((node) => node.open), true, 'mobile toc opens');
            await index.locator('nav a').nth(2).click();
            assert.equal(await index.evaluate((node) => node.open), false, 'mobile toc closes after selection');
            assert.ok(page.url().includes('#privacy-'), 'mobile toc anchor');

            await page.goto(base + '/contact');
            let succeeds = true;
            await page.route('**/api/contact', async (route) => route.fulfill({
              status: succeeds ? 200 : 502,
              contentType: 'application/json',
              body: JSON.stringify(succeeds ? {ok: true, referenceId: 'UI-SMOKE-TEST', confirmationSent: true, message: 'Enquiry received.'} : {ok: false, message: 'Temporary test failure.'}),
            }));
            const fill = async () => {
              await page.locator('.contact-layout input[autocomplete="name"]').fill('UI test');
              await page.locator('.contact-layout input[type="email"]').fill('qa@example.com');
              await page.locator('.contact-layout textarea').fill('Automated browser test - no message is sent to the real server.');
            };
            await fill();
            await page.locator('.contact-layout button[type="submit"]').click();
            await page.locator('.toast-success').waitFor();
            assert.ok((await page.locator('.toast-success').innerText()).includes('Enquiry received'), 'success toast');
            assert.equal(await page.locator('.toast-success .toast-progress').count(), 1, 'toast lifetime indicator');
            await page.locator('.toast-success .toast-close').click();
            await page.locator('.toast-success').waitFor({ state: 'detached' });
            succeeds = false;
            await fill();
            await page.locator('.contact-layout button[type="submit"]').click();
            await page.locator('.toast-error').waitFor();
            assert.equal(await page.locator('.toast-error .toast-action').count(), 1, 'error action preserved');
            console.log('PASS: desktop/mobile legal pages, anchors, responsive navigation, success/error toasts, dismiss and progress');
          } finally {
            await browser.close();
          }
          JS

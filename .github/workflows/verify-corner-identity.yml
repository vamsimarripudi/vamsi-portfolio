name: Verify Corner identity and account routing
on:
  push:
    paths:
      - 'corner/**'
      - '.github/workflows/verify-corner-identity.yml'
  pull_request:
    paths:
      - 'corner/**'
      - '.github/workflows/verify-corner-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Install FFmpeg for actual iPhone MOV integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Portfolio and Corner regression suite
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm --prefix corner install --omit=dev --no-audit --no-fund --package-lock=false
          cd corner
          npm run check
      - name: Install Chromium for responsive account test
        run: |
          npm install --no-save --no-package-lock playwright@1.64.0
          npx playwright install chromium --with-deps
      - name: Run isolated account browser acceptance
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';
          import os from 'node:os';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { passwordHash } from './corner/src/auth.mjs';
          const origin='http://127.0.0.1:4181';
          const directory=fs.mkdtempSync(path.join(os.tmpdir(),'corner-account-browser-'));
          const outbox=path.join(directory,'test-mails.jsonl');fs.writeFileSync(outbox,'');
          const env={...process.env,HOST:'127.0.0.1',PORT:'4181',DB_PATH:path.join(directory,'test.sqlite'),DATA_DIR:directory,
            NODE_ENV:'test',SITE_URL:origin+'/corner',CORNER_BASE_PATH:'/corner',DEMO_CONTENT:'0',
            CORNER_AUTH_REGISTRATION_ENABLED:'1',CORNER_AUTH_TEST_OUTBOX:outbox,
            ADMIN_EMAIL:'owner-e2e@example.test',ADMIN_PASSWORD_HASH:passwordHash('Synthetic-Owner-E2E-Passphrase#2026'),
            SESSION_SECRET:crypto.randomBytes(48).toString('hex')};
          const server=spawn(process.execPath,['--no-warnings','src/server.mjs'],{cwd:'corner',env,stdio:'ignore'});
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const sizes=[{width:320,height:690},{width:375,height:812},{width:768,height:1024},{width:1366,height:768}];
          const email='verified-e2e@example.test',pass='Strong-Test-Member-Passphrase#2026';
          try{
            let ready=false;for(let i=0;i<65;i++){
              try{if((await fetch(origin+'/corner/api/health')).ok){ready=true;break}}catch{}
              await sleep(100);
            }
            assert.equal(ready,true,'isolated test instance ready');
            for(const viewport of sizes){
              const page=await browser.newPage({viewport});
              const response=await page.goto(origin+'/corner/register',{waitUntil:'networkidle'});
              assert.equal(response.status(),200);
              assert.equal(await page.locator('form[data-account-form="register"]').count(),1);
              const layout=await page.evaluate(()=>({client:document.documentElement.scrollWidth,view:innerWidth}));
              assert.ok(layout.client<=layout.view+1,'no horizontal overflow '+viewport.width);
              const paper=await page.locator('.account-card').evaluate(el=>({background:getComputedStyle(el).backgroundColor,color:getComputedStyle(el).color}));
              assert.equal(paper.background,'rgb(255, 255, 255)');
              assert.equal(paper.color,'rgb(0, 0, 0)');
              const passField=page.locator('form[data-account-form="register"] input[type="password"]');
              assert.equal(await passField.isVisible(),false,'email-first progressive reveal');
              await page.locator('form[data-account-form="register"] input[name="email"]').fill(email);
              assert.equal(await passField.isVisible(),true,'valid email reveals password');
              await page.close();
              console.log('PASS account viewport '+viewport.width+'×'+viewport.height);
            }
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto(origin+'/corner/register',{waitUntil:'networkidle'});
            const form=page.locator('form[data-account-form="register"]');
            await form.locator('input[name="name"]').fill('Synthetic Browser Member');
            await form.locator('input[name="email"]').fill(email);
            await form.locator('input[name="password"]').fill(pass);
            await form.locator('button[type="submit"]').click();
            await page.getByText('Check your email for a verification link.').waitFor();
            const messages=fs.readFileSync(outbox,'utf8').trim().split('\n').map(s=>JSON.parse(s));
            assert.equal(messages.length,1,'exactly one test verification message');
            const url=messages[0].text.match(/https?:\/\/\S+/)?.[0];
            assert.ok(url);
            await page.goto(url,{waitUntil:'networkidle'});
            await page.locator('form[data-account-form="verify"] button[type="submit"]').click();
            await page.getByText('Email verified. You can sign in now.').waitFor();
            await page.goto(origin+'/corner/login',{waitUntil:'networkidle'});
            const login=page.locator('form[data-account-form="login"]');
            await login.locator('input[name="email"]').fill(email);
            await login.locator('input[name="password"]').fill(pass);
            await login.locator('button[type="submit"]').click();
            await page.waitForURL('**/corner/profile',{timeout:12000});
            await page.getByText('Private account · Signed in').waitFor();
            assert.match((await page.locator('body').textContent()),/Your quiet space/);
            // Quiet Desk is exercised using the isolated synthetic member
            // and its real first-party auth cookie, never a production account.
            fs.mkdirSync('screenshots/quiet-desk',{recursive:true});
            for(const width of [320,375,390,768,1024,1366]){
              const height=width<768?844:900;
              await page.setViewportSize({width,height});
              await page.goto(origin+'/corner/profile',{waitUntil:'networkidle'});
              await page.locator('.quiet-profile-hero').waitFor({state:'visible'});
              const geom=await page.evaluate(()=>({
                viewport:innerWidth,body:document.documentElement.scrollWidth,
                desk:!!document.querySelector('.quiet-desk-grid'),
                menu:document.querySelectorAll('.quiet-nav-link').length,
                photo:!!document.querySelector('.quiet-avatar'),
                pulse:!!document.querySelector('.corner-orbit-dock')
              }));
              assert.ok(geom.body<=geom.viewport+1,'No Quiet Desk overview overflow '+width+' '+JSON.stringify(geom));
              assert.ok(geom.desk&&geom.menu===6&&geom.photo,'Six-section private account shell '+width);
              if(width<=700){
                const nav=page.locator('.quiet-navigation');
                const layout=await nav.evaluate(el=>({
                  display:getComputedStyle(el).display,
                  columns:getComputedStyle(el).gridTemplateColumns.split(' ').filter(Boolean).length,
                  items:[...el.querySelectorAll('.quiet-nav-link')].map(link=>{
                    const rect=link.getBoundingClientRect();
                    return {left:rect.left,right:rect.right,width:rect.width};
                  })
                }));
                assert.equal(layout.display,'grid','All account options use visible mobile grid '+width);
                assert.equal(layout.columns,3,'Six controls in a two-row mobile grid '+width);
                assert.ok(layout.items.length===6&&layout.items.every(item=>item.width>=67&&item.left>=-1&&item.right<=width+1),
                  'All account sections fit without scrolling horizontally '+width+' '+JSON.stringify(layout));
              }
              assert.equal(geom.pulse,false,'Pulse never overlaps member controls '+width);
              if(width===390||width===1366)await page.screenshot({path:'screenshots/quiet-desk/profile-'+width+'.png',fullPage:false,animations:'disabled'});
              await page.goto(origin+'/corner/settings/profile',{waitUntil:'networkidle'});
              await page.locator('form[data-account-form=profile]').waitFor();
              assert.equal(await page.locator('[data-avatar-file]').count(),1,'Photo and crop available '+width);
              assert.equal(await page.locator('input[name=displayName]').count(),1,'Private display name available '+width);
              const editWidth=await page.evaluate(()=>document.documentElement.scrollWidth);
              assert.ok(editWidth<=width+1,'Edit profile does not overflow '+width);
              if(width===390)await page.screenshot({path:'screenshots/quiet-desk/edit-profile-'+width+'.png',fullPage:false,animations:'disabled'});
            }
            await page.setViewportSize({width:390,height:844});
            await page.goto(origin+'/corner/saved',{waitUntil:'networkidle'});
            await page.locator('[data-account-bookmarks]').waitFor();
            await page.getByText('No saved stories yet.').waitFor({timeout:10000});
            assert.equal(await page.locator('[data-bookmark-count]').textContent(),'0 saved','True count from first-party private bookmark API');
            await page.screenshot({path:'screenshots/quiet-desk/saved-mobile.png',animations:'disabled'});
            await page.goto(origin+'/corner/settings/preferences',{waitUntil:'networkidle'});
            const pref=page.locator('form[data-account-form=preferences]');
            await pref.waitFor();
            assert.equal(await pref.locator('input[name=emailUpdates][role=switch]').count(),1,'Accessible optional email switch');
            assert.equal(await pref.locator('input[name=emailUpdates]').isChecked(),false,'Optional email updates off unless opted in');
            await pref.locator('select[name=locale]').selectOption('te');
            await pref.locator('button[type=submit]').click();
            await pref.getByText('Preferences saved.').waitFor();
            await page.reload({waitUntil:'networkidle'});
            assert.equal(await page.locator('select[name=locale]').inputValue(),'te','Preference persisted through the API');
            await page.screenshot({path:'screenshots/quiet-desk/preferences-mobile.png',animations:'disabled'});
            await page.goto(origin+'/corner/settings/privacy',{waitUntil:'networkidle'});
            await page.locator('[data-account-export]').waitFor();
            await page.locator('[data-account-delete]').click();
            const dialog=page.locator('[data-account-delete-dialog]');
            assert.equal(await dialog.isVisible(),true,'Account deletion requires explicit review');
            await page.locator('[data-delete-cancel]').click();
            assert.equal(await dialog.isVisible(),false,'Review can be dismissed without requesting deletion');
            await page.goto(origin+'/corner/settings/security',{waitUntil:'networkidle'});
            await page.getByRole('heading',{name:'Active sessions.',exact:true}).waitFor();
            await page.locator('[data-account-sessions]').getByText('Signed in').first().waitFor();
            console.log('PASS Quiet Desk overview/edit 320–1366px, real bookmark count, preferences, privacy confirmation and session safety');
            // The public account menu must not expose Studio controls to members.
            await page.setViewportSize({width:390,height:844});
            await page.goto(origin+'/corner/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('[data-profile-member]')?.hidden===false);
            // First public visit legitimately opens the welcome modal. Dismiss
            // it before checking the background profile menu, as a user does.
            const welcome=page.locator('.pulse-welcome-modal');
            if(await welcome.count()){
              assert.equal(await welcome.evaluate(el=>el.matches(':modal')),true);
              await welcome.locator('[data-letter-dismiss]').click();
              await welcome.waitFor({state:'detached'});
            }
            await page.locator('[data-corner-profile-toggle]').click();
            assert.equal(await page.locator('[data-profile-guest]').isVisible(),false);
            assert.equal(await page.locator('[data-owner-studio]').isVisible(),false,'Owner Studio hidden for members');
            assert.equal(await page.locator('[data-profile-logout]').isVisible(),true);
            assert.equal(await page.locator('[data-profile-menu-name]').textContent(),'Synthetic Browser Member');
            await page.keyboard.press('Escape');
            assert.equal(await page.locator('#corner-profile-card').isVisible(),false);
            console.log('PASS Quiet Desk overview/edit 320–1366px, real saved stories, Pulse clearance, role-gated menu');
            await page.locator('[data-corner-profile-toggle]').click();
            await page.locator('[data-profile-logout]').click();
            await page.waitForURL('**/corner/',{timeout:12000});
            await page.waitForFunction(()=>document.querySelector('[data-profile-member]')?.hidden===true&&document.querySelector('[data-profile-guest]')?.hidden===false,null,{timeout:15000});
            const signedOut=await page.evaluate(async()=>{
              const response=await fetch('/corner/api/v1/auth/session',{credentials:'same-origin',cache:'no-store'});
              return response.ok&&(await response.json())?.data?.authenticated===false;
            });
            assert.equal(signedOut,true,'Sign out invalidates the authenticated session');
            await page.locator('[data-corner-profile-toggle]').click();
            assert.equal(await page.locator('[data-profile-guest]').isVisible(),true,'Guest controls replace member options');
            assert.equal(await page.locator('[data-profile-member]').isVisible(),false,'Private menu controls stay hidden after logout');
            await page.close();
            console.log('PASS authenticated browser registration, verification, session, profile, navigation and logout');
            // Render the same server-side owner Studio markup with synthetic
            // in-memory owner data; exercise real CSS at mobile widths without
            // reusing credentials or touching production accounts.
            const {adminPage}=await import('./corner/src/ui.mjs');
            const synthetic=adminPage({owner:{id:'test-owner',role:'owner',email:'visual@example.test'}});
            const markup=synthetic.replace(/(href|src)=(["'])\/(?!\/)/g,(_,key,quote)=>key+'='+quote+'/corner/');
            for(const width of [320,375,390,430]){
              const ui=await browser.newPage({viewport:{width,height:844}});
              await ui.goto(origin+'/corner',{waitUntil:'domcontentloaded'});
              await ui.setContent(markup,{waitUntil:'load'});
              const layout=await ui.evaluate(()=>{
                const box=css=>document.querySelector(css)?.getBoundingClientRect();
                const nav=document.querySelector('.admin-nav');
                const first=nav?.querySelector(':is(button,.admin-v3-link)');
                const label=first?.querySelector('.studio-nav-label');
                return {body:document.documentElement.scrollWidth,viewport:innerWidth,
                 sidebar:box('.admin-sidebar')?.height,nav:box('.admin-nav'),first:first?.getBoundingClientRect(),
                 navDisplay:nav?getComputedStyle(nav).display:null,labelDisplay:label?getComputedStyle(label).display:null,
                 pickerDisplay:getComputedStyle(document.querySelector('.studio-section-picker')).display,mainY:box('.admin-main')?.top};
              });
              assert.ok(layout.body<=layout.viewport+1,'Mobile owner page overflow '+width+' '+JSON.stringify(layout));
              assert.ok(layout.sidebar>0&&layout.sidebar<130,'Sidebar/header compact '+width+' '+JSON.stringify(layout));
              assert.equal(layout.navDisplay,'flex','Labeled Studio rail remains visible '+width);
              assert.ok(layout.nav&&layout.nav.height<=64,'Studio rail remains one compact row '+width+' '+JSON.stringify(layout.nav));
              assert.ok(layout.first&&layout.first.width>=60&&layout.first.height>=56,'Studio rail targets remain touch-sized '+width+' '+JSON.stringify(layout.first));
              assert.equal(layout.labelDisplay,'block','Studio rail labels remain visible '+width);
              assert.equal(layout.pickerDisplay,'none','Legacy mobile section picker stays hidden '+width);
              assert.ok(layout.mainY<135,'Editor near top, not after huge gap '+width+' '+JSON.stringify(layout));
              await ui.close();
            }
            console.log('PASS compact labeled 320–430px owner Studio rail, no horizontal overflow');
          }finally{await browser.close();server.kill('SIGTERM');await sleep(130);fs.rmSync(directory,{recursive:true,force:true})}
          JS
      - name: Upload Quiet Desk account screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corner-quiet-desk-screenshots
          path: screenshots/quiet-desk/
          if-no-files-found: ignore
          retention-days: 7

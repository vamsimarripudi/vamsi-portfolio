name: Apply reviewed Studio source edits
on:
  push:
    branches: [fix/studio-live-sidebar-20261012]
    paths: ['.delivery/studio/**', '.github/workflows/apply-studio-source.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'vamsimarripudi/vamsi-portfolio' && github.ref == 'refs/heads/fix/studio-live-sidebar-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/studio-live-sidebar-20261012
      - name: Apply exact reviewed edits to this feature branch
        run: |
          python3 .delivery/studio/apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(studio): apply hash-verified live preview and fixed navigation changes'
          git push origin HEAD:fix/studio-live-sidebar-20261012

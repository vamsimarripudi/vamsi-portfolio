name: Verify portfolio + Corner integration
on:
  push:
    branches:
      - master
      - test/corner-operational-acceptance-20261008
      - feat/vamsis-corner-integrated-20261008
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install existing portfolio
        run: npm ci
      - name: Portfolio lint
        run: npm run lint
      - name: Portfolio tests
        run: npm test
      - name: Portfolio production build
        run: npm run build
      - name: Corner test suite including /corner mount and password rotation
        working-directory: corner
        run: npm run check
      - name: Verify route rewrites and standalone backend isolation
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const config=JSON.parse(readFileSync('vercel.json','utf8'));
          assert.equal(config.rewrites[0].source,'/corner');
          assert.equal(config.rewrites[1].source,'/corner/:path*');
          assert.match(config.rewrites[1].destination,/^https:\/\/.*up\.railway\.app\/corner\/:path\*$/);
          assert.ok(config.rewrites.some(r=>r.source==='/api/birthday'));
          const app=readFileSync('src/App.jsx','utf8');
          assert.ok(app.includes('<a href="/corner">Corner</a>'));
          const sitemap=readFileSync('public/sitemap.xml','utf8');
          assert.ok(sitemap.includes('https://vamsimarripudi.me/corner'));
          console.log('Integration configuration verified.');
          JS
      - name: Live production public-route and authentication-boundary smoke
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin='https://vamsimarripudi.me';
          const fetchSafe=async (path)=>{
            const response=await fetch(origin+path,{signal:AbortSignal.timeout(18000),headers:{'cache-control':'no-cache'}});
            return response;
          };
          const home=await fetchSafe('/corner');
          assert.equal(home.status,200,'Corner public URL');
          const page=await home.text();
          assert.match(page,/Thoughts, updates/,'server-rendered public feed');
          assert.match(page,/\/corner\/style\.css/,'assets preserve subpath');
          const health=await fetchSafe('/corner/api/health');
          assert.equal(health.status,200,'Corner health endpoint');
          const payload=await health.json();
          assert.equal(payload?.data?.database,'connected','production database ready');
          const feed=await fetchSafe('/corner/api/posts');
          assert.equal(feed.status,200,'published feed endpoint');
          assert.ok(Array.isArray((await feed.json())?.data),'feed JSON shape');
          const admin=await fetchSafe('/corner/admin');
          assert.equal(admin.status,200,'owner console login page');
          const unauthorized=await fetchSafe('/corner/api/admin/overview');
          assert.equal(unauthorized.status,401,'unauthenticated access is rejected');
          console.log('Production /corner: SSR, assets, DB, feed, login and authorization boundary verified');
          JS
      - name: Check offsite backup freshness on live production
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response=await fetch('https://vamsimarripudi.me/corner/api/v1/ready',{
            signal:AbortSignal.timeout(18000),headers:{'cache-control':'no-cache'}
          });
          assert.equal(response.status,200,'Corner readiness endpoint');
          const payload=await response.json();
          assert.equal(payload?.data?.backupFresh,true,'Offsite backup missing, failed or older than 26 hours');
          console.log('Recent verified offsite backup detected.');
          JS

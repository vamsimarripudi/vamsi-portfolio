name: Diwali firework validation

on:
  push:
    branches:
      - feat/diwali-interactive-fireworks-20261108
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  verify-fireworks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Diwali scripts
        run: |
          node --check corner/src/diwali-sender.mjs
          node --check corner/src/server.mjs
      - name: Run focused Diwali tests
        run: node --test corner/tests/diwali-personal.test.mjs corner/tests/diwali-fireworks.test.mjs

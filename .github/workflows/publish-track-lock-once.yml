name: Publish verified Track source blobs once
on:
  push:
    branches: ['chore/track-lock-transfer-20261012']
    paths: ['.github/workflows/publish-track-lock-once.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'vamsimarripudi/vamsi-portfolio' && github.ref == 'refs/heads/chore/track-lock-transfer-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify exact tested source and upload blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          digest = 'a16e7dfb9b02f6d39f1e0726d44bdb781c34ac4155f1ccf9e8ca77f469eb79bf'
          url = 'https://sb-d5c5o0l7gdx2.vercel.run/' + digest + '/tree.json'
          with urllib.request.urlopen(url, timeout=20) as response:
              data = response.read(100000)
          assert hashlib.sha256(data).hexdigest() == digest
          payload = json.loads(data)
          assert payload['base_tree'] == '3b7321f519c87a1f8e6d4b265aeac503bbbec5bd' and len(payload['tree']) == 12
          for item in payload['tree']:
              if 'content' not in item:
                  continue
              content = item['content'].encode('utf-8')
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              body = json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode()
              request = urllib.request.Request('https://api.github.com/repos/vamsimarripudi/vamsi-portfolio/git/blobs', data=body, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'
              })
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              assert result['sha'] == expected
              print(item['path'] + ' ' + expected, flush=True)
          print('All tested source blobs verified. No tree, branch or workflow was written by this job.')
          PY

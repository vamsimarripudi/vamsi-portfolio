name: Publish verified Track dependency blob once
on:
  push:
    branches: ['chore/track-lock-transfer-20261012']
    paths: ['.github/workflows/publish-track-lock-once.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'vamsimarripudi/vamsi-portfolio' && github.ref == 'refs/heads/chore/track-lock-transfer-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify exact tested lockfile and create Git blob (no branch writes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          expected = 'abf5b43f51a0447b1aed070546de94c9f322e3ac'
          url = 'https://sb-d5c5o0l7gdx2.vercel.run/' + expected + '/package-lock.json'
          with urllib.request.urlopen(url, timeout=20) as response:
              data = response.read(200000)
          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert actual == expected, 'Transferred lockfile does not match tested Git blob'
          assert json.loads(data)['lockfileVersion'] == 3
          body = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode()
          request = urllib.request.Request('https://api.github.com/repos/vamsimarripudi/vamsi-portfolio/git/blobs', data=body, method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
          assert result['sha'] == expected, 'Published blob differs from tested file'
          print('Verified and published exact dependency blob: ' + expected)
          PY

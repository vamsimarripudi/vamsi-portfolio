name: Publish verified Track source tree once
on:
  push:
    branches: ['chore/track-lock-transfer-20261012']
    paths: ['.github/workflows/publish-track-lock-once.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'vamsimarripudi/vamsi-portfolio' && github.ref == 'refs/heads/chore/track-lock-transfer-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify exact tested source and create Git tree (no branch writes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          digest = 'a16e7dfb9b02f6d39f1e0726d44bdb781c34ac4155f1ccf9e8ca77f469eb79bf'
          expected_tree = 'cf54c005662f9921ba103024b7a36f22b4b6d5e3'
          url = 'https://sb-d5c5o0l7gdx2.vercel.run/' + digest + '/tree.json'
          with urllib.request.urlopen(url, timeout=20) as response:
              data = response.read(100000)
          assert hashlib.sha256(data).hexdigest() == digest, 'Source payload does not match tested bytes'
          payload = json.loads(data)
          assert payload['base_tree'] == '3b7321f519c87a1f8e6d4b265aeac503bbbec5bd'
          assert len(payload['tree']) == 12
          request = urllib.request.Request('https://api.github.com/repos/vamsimarripudi/vamsi-portfolio/git/trees', data=data, method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
          assert result['sha'] == expected_tree, 'Published tree differs from tested tree'
          print('Verified and published exact tested tree: ' + expected_tree)
          PY

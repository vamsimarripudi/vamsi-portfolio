name: Expand Vamsi's Corner source
on:
  push:
    branches:
      - feat/vamsis-corner-integrated-20261008
permissions:
  contents: write
jobs:
  expand:
    if: "!contains(github.event.head_commit.message, 'expand Corner source')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Prepare Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Expand verified runtime archive
        run: |
          test -f corner/runtime.tar.br
          node -e "const fs=require('fs'),zlib=require('zlib');fs.writeFileSync('corner/runtime.tar',zlib.brotliDecompressSync(fs.readFileSync('corner/runtime.tar.br')))"
          tar -tf corner/runtime.tar | grep -Ev '^([a-zA-Z0-9._/-]+)$' && exit 1 || true
          tar -xf corner/runtime.tar -C corner
          rm corner/runtime.tar
          test -f corner/src/server.mjs
          test -f corner/public/style.css
          test -f corner/tests/subpath.test.mjs
      - name: Verify bundle
        working-directory: corner
        run: |
          npm run check
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corner/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: expand Corner source files after checks"
          git push origin HEAD:feat/vamsis-corner-integrated-20261008
